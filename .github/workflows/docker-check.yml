name: RetainIQ CI/CD Validation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Run code quality check
        run: |
          flake8 api/ src/ --max-line-length=120 --ignore=E501,W503 --count --statistics
        continue-on-error: true

  api-tests:
    name: API Health Tests
    runs-on: ubuntu-latest
    needs: code-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn httpx pytest pytest-asyncio scikit-learn pandas numpy joblib mlflow python-multipart

      - name: Create API test file
        run: |
          cat > test_api.py << 'EOF'
          from fastapi.testclient import TestClient
          import sys

          sys.path.insert(0, ".")
          from api.main import app

          client = TestClient(app)

          def test_health_endpoint():
              response = client.get("/health")
              assert response.status_code == 200

          def test_home_endpoint():
              response = client.get("/")
              assert response.status_code == 200

          def test_model_info_endpoint():
              response = client.get("/model_info")
              assert response.status_code == 200

          def test_metrics_endpoint():
              response = client.get("/metrics")
              assert response.status_code == 200
          EOF

      - name: Run API tests
        run: pytest test_api.py -v

  docker-validation:
    name: Docker Deployment Validation
    runs-on: ubuntu-latest
    needs: api-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build Docker Compose services
        run: docker compose build

      - name: Start Docker Compose services
        run: docker compose up -d

      - name: Check running containers
        run: docker ps

      - name: Stop Docker Compose services
        run: docker compose down
