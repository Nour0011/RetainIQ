name: RetainIQ CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall .

      - name: Run tests if tests folder exists
        run: |
          if [ -d "tests" ]; then
            pip install pytest
            pytest tests/
          else
            echo "No tests folder found. Skipping tests."
          fi

      - name: Build Docker image
        run: |
          docker build -t retainiq-mlops .

      - name: Test Docker image starts
        run: |
          docker run -d -p 8000:8000 --name retainiq retainiq-mlops
          sleep 10
          docker ps
          docker stop retainiq